# Publishes the website to GitHub Pages on every push to main.
# The WebAssembly VM is prebuilt into web/try/pkg by `npm run build`, so no Rust toolchain is needed here.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R web/. _site/
          mkdir -p _site/try/lib
          cp -R vm/lib/. _site/try/lib/
          cp LICENSE _site/LICENSE.txt
          cp LICENSE-0BSD _site/LICENSE-0BSD.txt
          cp THIRD-PARTY-NOTICES.txt _site/THIRD-PARTY-NOTICES.txt
          touch _site/.nojekyll
          test -f _site/try/pkg/strongtalk_bg.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
