[package]
name = "strongtalk"
version = "0.2.0"
edition = "2021"
description = "A Strongtalk (typed Smalltalk) environment re-implemented in Rust"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "strongtalk"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
